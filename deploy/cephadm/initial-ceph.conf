[global]
osd_pool_default_pg_num   = 32
osd_pool_default_pgp_num  = 1
osd_pool_default_size     = 3
osd_pool_default_min_size = 1
mon_max_pg_per_osd        = 1024
# max_open_files            = 131072
# container_image registry.wrx.sckt.net/quay/ceph/ceph:v19.2.3

[osd]
filestore_queue_max_bytes = 1048576000
filestore_queue_max_ops   = 50000
# osd_crush_initial_weight  = 0
# osd_op_threads            = 16
# osd_disk_threads          = 4

[mon]
mon_compact_on_start                  = true
mon_osd_down_out_subtree_limit        = host
auth_allow_insecure_global_id_reclaim = false

[mgr]
# https://docs.ceph.com/en/latest/cephadm/services/monitoring/#using-custom-images
mgr/cephadm/container_image_prometheus    = registry.wrx.sckt.net/quay/prometheus/prometheus:v2.51.0
mgr/cephadm/container_image_node_exporter = registry.wrx.sckt.net/quay/prometheus/node-exporter:v1.7.0
mgr/cephadm/container_image_grafana       = registry.wrx.sckt.net/quay/ceph/grafana:10.4.0
mgr/cephadm/container_image_alertmanager  = registry.wrx.sckt.net/quay/prometheus/alertmanager:v0.25.0
mgr/cephadm/container_image_haproxy       = registry.wrx.sckt.net/quay/ceph/haproxy:2.3
mgr/cephadm/container_image_keepalived    = registry.wrx.sckt.net/quay/ceph/keepalived:2.2.4
